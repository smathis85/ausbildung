# AUSBILDUNG_PROD_V1
server {
    listen 80;
    server_name ausbildung.einsatzleiter.app;
    return 301 https://ausbildung.einsatzleiter.app$request_uri;
}
server {
    listen 443 ssl;
    server_name ausbildung.einsatzleiter.app;
    root /opt/ausbildung/public;
    ssl_certificate /etc/ssl/einsatzleiter/fullchain.pem;
    ssl_certificate_key /etc/ssl/einsatzleiter/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    access_log /var/log/nginx/ausbildung-access.log combined;
    error_log /var/log/nginx/ausbildung-error.log warn;
    location = / { rewrite ^ /index.php last; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/ausbildung/public/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/ausbildung.sock;
        fastcgi_hide_header X-Powered-By;
    }
    location ~ ^/assets/[a-zA-Z0-9_-]+\.(css|js)$ {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff;
        expires 1h;
    }
    location = /assets/vg-selters-logo.png {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff;
        expires 7d;
    }
    location / { return 404; }
}

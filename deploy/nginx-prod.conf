# AUSBILDUNG_PROD_V1
server {
    listen 31.70.156.126:80;
    server_name ffvgs-ausbildung.de;
    return 301 https://ffvgs-ausbildung.de$request_uri;
}
server {
    listen 31.70.156.126:443 ssl;
    server_name ffvgs-ausbildung.de;
    root /opt/ausbildung/public;
    ssl_certificate /etc/ssl/ausbildung/fullchain.pem;
    ssl_certificate_key /etc/ssl/ausbildung/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 52m;
    access_log /var/log/nginx/ausbildung-access.log combined;
    error_log /var/log/nginx/ausbildung-error.log warn;
    location = / { rewrite ^ /index.php last; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/ausbildung/public/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/ausbildung.sock;
        fastcgi_hide_header X-Powered-By;
    }
    location ~ ^/assets/[a-zA-Z0-9_-]+\.(css|js)$ {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff;
        expires 1h;
    }
    location = /assets/vg-selters-logo.png {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff;
        expires 7d;
    }
    location / { return 404; }
}

server { listen 31.70.156.126:80; server_name www.ffvgs-ausbildung.de; return 301 https://ffvgs-ausbildung.de$request_uri; }
server { listen 31.70.156.126:443 ssl; server_name www.ffvgs-ausbildung.de; ssl_certificate /etc/ssl/ausbildung/fullchain.pem; ssl_certificate_key /etc/ssl/ausbildung/private.key; ssl_protocols TLSv1.2 TLSv1.3; return 301 https://ffvgs-ausbildung.de$request_uri; }

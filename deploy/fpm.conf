; AUSBILDUNG_DEV_V1
[ausbildung-dev]
user = ausbildung-dev
group = ausbildung-dev
listen = /run/php/ausbildung-dev.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 3
pm.process_idle_timeout = 15s
pm.max_requests = 300
clear_env = yes
env[TRAINING_DATA_DIR] = /var/lib/ausbildung-dev
php_admin_value[open_basedir] = /opt/ausbildung-dev:/var/lib/ausbildung-dev
php_admin_value[sys_temp_dir] = /var/lib/ausbildung-dev/tmp
php_admin_value[upload_tmp_dir] = /var/lib/ausbildung-dev/tmp
php_admin_value[session.save_path] = /var/lib/ausbildung-dev/sessions
php_admin_value[disable_functions] = exec,shell_exec,system,passthru,popen,proc_open,pcntl_exec
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/lib/ausbildung-dev/php-error.log
php_admin_flag[allow_url_fopen] = off
php_admin_value[memory_limit] = 128M
php_admin_value[max_execution_time] = 30
php_admin_value[upload_max_filesize] = 50M
php_admin_value[post_max_size] = 52M
php_admin_value[max_input_time] = 300
php_admin_flag[expose_php] = off
